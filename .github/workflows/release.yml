name: 自动发布客户端 APK
run-name: 发布客户端 ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 主仓自动传入的客户端版本标签
        required: true
        type: string
      artifact_id:
        description: 仅重试发布时填写已成功签名的制品ID；正常自动发版留空
        required: false
        type: string
      artifact_run_id:
        description: 上述签名制品所属的成功build作业run ID
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: client-release-${{ inputs.tag }}
  queue: max
  cancel-in-progress: false
env:
  GIT_MASTER: '1'
jobs:
  trust:
    if: github.repository_id == '1373788867' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.client_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/release
          persist-credentials: false
      - name: 核对受控恢复制品来源
        if: inputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: timeout 120s python3 tools/release/github.py verify-recovery "$ARTIFACT_RUN_ID" "$ARTIFACT_ID" "$RELEASE_TAG"
      - name: 绑定可信主线、标签和控制面
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RECOVERY: ${{ inputs.artifact_id }}
        run: |
          if [ -n "$RECOVERY" ]; then
            timeout 150s python3 tools/release/verify.py trusted-recovery-tag "$RELEASE_TAG"
          else
            timeout 150s python3 tools/release/verify.py trusted-tag "$RELEASE_TAG"
          fi
  module:
    needs: trust
    if: inputs.artifact_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.commit }}
          persist-credentials: false
      - name: 校验版本、实际源码树与模块交接
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: timeout 30s python3 tools/release/verify.py metadata "$RELEASE_TAG"
      - name: 下载并核对本仓 draft 模块
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          MODULE_NAME: ${{ steps.metadata.outputs.module_name }}
        run: |
          mkdir dist
          timeout 180s gh release download "$RELEASE_TAG" --repo lilyzhaun/softvowifi-client --pattern "$MODULE_NAME" --dir dist
          timeout 30s python3 tools/release/verify.py module "dist/$MODULE_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: module-handoff
          path: dist/
          retention-days: 3
          if-no-files-found: error
  build:
    needs: [trust, module]
    if: inputs.artifact_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 校验版本与实际源码树
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: timeout 30s python3 tools/release/verify.py metadata "$RELEASE_TAG"
      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        timeout-minutes: 10
        with:
          packages: platform-tools cmdline-tools;latest
          log-accepted-android-sdk-licenses: false
      - name: 准备 Android 工具链
        run: |
          timeout 600s sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          timeout 500s bash tools/release/linux-tools.sh
      - name: 从本仓源码独立构建 unsigned APK
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p /tmp/opencode
          timeout 1800s bash tools/release/build-apk.sh
          timeout 30s python3 tools/release/verify.py metadata "$RELEASE_TAG"
          mkdir dist
          cp app/manager/androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk dist/client-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: client-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 3
  sign:
    needs: [trust, module, build]
    if: inputs.artifact_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: client-release-signing
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: tools/release
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        timeout-minutes: 10
        with:
          packages: platform-tools cmdline-tools;latest
          log-accepted-android-sdk-licenses: false
      - run: timeout 600s sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.module.outputs.artifact }}
          merge-multiple: true
          path: source/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: unsigned
      - name: 核对签名前的源码和模块
        id: metadata
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: timeout 30s python3 ../control/tools/release/verify.py metadata "$RELEASE_TAG"
      - name: 准备临时签名材料
        working-directory: source
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: timeout 30s python3 ../control/tools/release/signing.py prepare
      - name: 独立签名与校验
        working-directory: source
        env:
          APK_SIGNING_CERT_SHA256: ${{ vars.APK_SIGNING_CERT_SHA256 }}
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
          MODULE_NAME: ${{ steps.metadata.outputs.module_name }}
        run: |
          timeout 30s python3 ../control/tools/release/verify.py module "dist/$MODULE_NAME"
          timeout 60s "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks .secrets/vowifi-observer.keystore --ks-pass file:.secrets/vowifi-signing.password --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "dist/$APK_NAME" ../unsigned/client-unsigned.apk
          timeout 60s python3 ../control/tools/release/signing.py verify "dist/$APK_NAME"
          timeout 60s python3 ../control/tools/release/verify.py apk "dist/$APK_NAME"
          timeout 30s python3 ../control/tools/release/verify.py checksums dist
      - name: 清理签名材料
        if: always()
        working-directory: source
        run: timeout 30s python3 ../control/tools/release/signing.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: client-release
          path: source/dist/
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [trust, sign]
    if: always() && needs.trust.result == 'success' && (needs.sign.result == 'success' || inputs.artifact_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: tools/release
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.artifact_id || needs.sign.outputs.artifact }}
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          path: source/dist
      - name: 核对签名制品的源提交元数据
        working-directory: source
        run: timeout 30s python3 ../control/tools/release/verify.py release-artifact dist
      - name: 发布 APK 与同字节模块 ZIP
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CLIENT_COMMIT: ${{ needs.trust.outputs.commit }}
        run: timeout 300s python3 ../control/tools/release/github.py dist "$RELEASE_TAG" "$CLIENT_COMMIT"
