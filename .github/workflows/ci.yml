name: 客户端只读构建
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: client-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_MASTER: '1'
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        timeout-minutes: 10
        with:
          packages: platform-tools cmdline-tools;latest
          log-accepted-android-sdk-licenses: false
      - run: timeout 600s sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: timeout 500s bash tools/release/linux-tools.sh
      - run: |
          mkdir -p /tmp/opencode
          timeout 1800s bash tools/release/build-apk.sh --check
